# Notes — a local Markdown knowledge base. Shipped in the coque, selectable,
# recommended (opt-out): installed by default, but you may decline.

bundle: Notes
emoji: 📓
description: A local Markdown knowledge base.
priority: 30
selectable: true
posture: opt-out

packages:
  - name: Obsidian
    description: Local Markdown knowledge base
    winget: Obsidian.Obsidian
    # NO detect: — Obsidian is a GUI app with no CLI binary on PATH. Presence is
    # derived from the ROUTE (winget list --id), not a hand-written command. On
    # Windows that's exact; on Mac (no winget) it reads as indeterminate, not
    # absent. See detect.ts routeProbe.
