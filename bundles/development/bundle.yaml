# Development — what lets your AI version code and edit it in a terminal. The VCS
# travels WITH its AI manual (the Claude plugin), because tool + manual are one
# capability. Shipped in the coque, recommended (opt-out): jj is the VCS the
# family uses day to day, so it's present by default — decline freely.
#
# A plugin row `requires: [Claude Code]` — indeterminate until the agent is
# present or wanted (deps.ts); topoSort installs jj and the agent before the
# plugin that needs them.

bundle: Development
emoji: 🔧
description: Version control and terminal editing your AI can drive.
priority: 18
selectable: true
posture: opt-out # recommended — the family's daily VCS; decline if unwanted

packages:
  - name: jj
    description: Jujutsu — a Git-compatible VCS the family uses day to day
    winget: jj-vcs.jj
    detect: jj --version

  - name: jj skills
    description: AI manual for Jujutsu — pairs with the jj binary
    claude-plugin: jj@claude-plugin-jj
    marketplace: kawaz/claude-plugin-jj
    detect: jj
    requires:
      - jj
      - Claude Code

  - name: Helix
    description: Modal terminal editor
    winget: Helix.Helix
    detect: hx --version
