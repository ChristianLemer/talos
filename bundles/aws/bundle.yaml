# AWS — cloud tooling. Opt-out: the family's agents are Bedrock-backed, so the
# AWS CLI (credentials, SSO, Bedrock auth) is a default prerequisite — present
# unless you decline. Kept OUT of Foundation on purpose — the neutral substrate
# names no client; AWS is a specific need, declared here as its own capability.

bundle: AWS
emoji: ☁️
description: AWS command-line tooling — for Bedrock-backed agents (auth, SSO).
priority: 40
selectable: true
posture: opt-out # Bedrock auth by default; decline if you don't use AWS

packages:
  - name: AWS CLI
    description: Command-line access to AWS — credentials, SSO, Bedrock auth
    winget: Amazon.AWSCLI
    detect: aws --version
