# An example bundle: optional command-line tools for power users. Proves the scan
# picks up additions with zero code change — drop a bundle file here and a new
# selectable card appears. Delete freely — it's only a demonstration.
#
# posture is a BUNDLE-level policy: mandatory | opt-out | opt-in | forbidden.
#   mandatory — always present, user cannot decline (locked)
#   opt-out   — present by default, user may remove
#   opt-in    — absent by default, user may add
#   forbidden — always absent, actively removed, user cannot enable (locked)
bundle: Power tools
emoji: 🛠️
description: Optional command-line tools for power users.
priority: 50
selectable: true
posture: opt-in # optional tools — installed only if you opt in
packages: [ripgrep, fd, bat]
