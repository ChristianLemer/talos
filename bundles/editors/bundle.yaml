# Editors — where you see and edit what the AI produces. Shipped in the coque,
# selectable, recommended (opt-out): installed by default, but you may decline.

bundle: Editors
emoji: ✏️
description: Where you see and edit what the AI produces.
priority: 10
selectable: true
posture: opt-out # recommended — installed unless you opt out

packages:
  - name: Visual Studio Code
    description: Where you see and edit what the AI produces
    winget: Microsoft.VisualStudioCode
    brew: visual-studio-code
    detect: code --version
    category: [editors]

  - name: MarkText
    description: Distraction-free Markdown editor — specs, briefs, notes
    winget: MarkText.MarkText
    brew: mark-text
    # NO detect: — GUI app, no CLI binary on PATH. Presence via the native
    # system-manager route (winget on Windows, brew on Mac), like Obsidian.
    # Indeterminate only where no system manager is practicable, never absent.
