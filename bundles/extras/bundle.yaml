# An example bundle OUTSIDE the coque (lives in ./bundles/, not talos/bundles/).
# It proves the scan picks up additions with zero code change: drop a folder
# here and a new selectable card appears. An integrator (e.g. a corporate network) adds its own
# bundles the same way. Delete this folder freely — it's only a demonstration.

bundle: Power tools
emoji: 🛠️
description: Optional command-line tools for power users.
priority: 50
selectable: true
# posture is a BUNDLE-level policy: mandatory | opt-out | opt-in | forbidden.
#   mandatory — always present, user cannot decline (locked)
#   opt-out   — present by default, user may remove
#   opt-in    — absent by default, user may add
#   forbidden — always absent, actively removed, user cannot enable (locked)
# All packages in the bundle share it. Want a different policy? Make another
# bundle — a bundle mixing postures would make its own pill lie.
posture: opt-in # optional tools — installed only if you opt in

packages:
  - name: ripgrep
    description: Blazingly fast search
    winget: BurntSushi.ripgrep.MSVC
    brew: ripgrep
    detect: rg --version

  - name: fd
    description: Fast, friendly alternative to find
    winget: sharkdp.fd
    brew: fd
    detect: fd --version

  - name: bat
    description: cat with syntax highlighting
    winget: sharkdp.bat
    brew: bat
    detect: bat --version
