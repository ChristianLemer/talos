# Foundation — the invisible plumbing every agent and tool stands on. Shipped in
# the coque. No delivery story for a human: node/git/jq/nu just have to be there.
# The NEUTRAL substrate — no client named here (hermeticity: the engine knows no
# specific AI). The agent itself lives in the Agents bundle; the capabilities you
# give it (Automation, Development) in their own bundles; comfort in theirs.
#
# Nushell is here as the LANGUAGE OF RECIPES: config-atoms (a bundle's `run:`
# steps that patch a config file) are written in `nu` — structured, idempotent,
# cross-platform, one language for all patching. RED LINE (hermeticity): the
# engine (Deno) NEVER calls `nu` itself — only bundle CONTENT does. Foundation
# merely guarantees the tool that content asks for is present, so an opt-out
# config-atom actually applies on a default machine.
#
# YAML by indentation (never {} inline). Package managers are named fields
# (winget:, npm:) — winget is winget, known; we don't abstract into opaque
# command strings. requires: lists dependencies (installed first).

bundle: Foundation
emoji: 🧱
description: The plumbing everything stands on — runtime, version control, JSON.
priority: 0
selectable: true
posture: opt-out # the recommended default; present unless you flip out

packages:
  - name: Node.js
    description: JavaScript runtime — required by this tool itself and by CLI agents
    winget: OpenJS.NodeJS
    brew: node
    detect: node --version

  - name: Git
    description: Version control — required by agent plugin marketplaces
    winget: Git.Git
    brew: git
    detect: git --version

  - name: jq
    description: JSON CLI — required by some agent plugin hooks
    winget: jqlang.jq
    brew: jq
    detect: jq --version

  - name: Nushell
    description: Structured shell — the language Talos config-atoms are written in
    winget: Nushell.Nushell
    brew: nushell
    detect: nu --version
