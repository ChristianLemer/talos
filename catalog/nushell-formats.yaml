# Formats for Nushell — a plugin that SHIPS WITH nushell: the binary is already beside `nu`.
# ⭐ No `plugin-release:`, and that absence is the whole declaration — it puts this on the
# ⚡ rung, because registering it engages no network at all (measured: `plugin add
# nu_plugin_formats` resolves via NU_PLUGIN_DIRS, which contains the directory holding `nu`).
name: Formats for Nushell
description: Parse eml, ics, plist, vcf formats in nushell
nu-plugin: formats
category: [terminal]
requires:
  - Nushell
