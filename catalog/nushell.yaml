# Nushell — a shell where everything is data: tables in, tables out, no parsing of text.
# The language Talos's own scripted config-atoms are written in, and the shell an agent
# is happiest driving. `latest`: an upgrade breaks the plugin rows below (a plugin loads into
# one minor), Talos sees it because it STARTS each plugin, and Apply re-registers them.
name: Nushell
description: A shell where everything is data — tables in, tables out
winget: Nushell.Nushell
brew: nushell
detect: nu --version
version: latest
# `user`: Nushell is a personal tool, never one an IT department installs. Declared, every
# winget install lands in the profile — and a downgrade puts it back there, wherever the copy
# it replaces was (its uninstall removes every copy).
scope: user
category: [terminal]
uac: true
# A shell is a legitimate rescue too: when the agent is what is broken, this is what is
# left. `nu -n` loads no config files (MEASURED: it is how every sidecar check here runs).
doctor:
  clean: { args: ["-n"] }
