# Cyberduck — FTP/FTPS/SFTP/WebDAV/S3 browser. The CROSS-PLATFORM candidate to replace
# FileZilla, which winget cannot ship (see catalog/filezilla.yaml).
#
# Why it earns a place next to WinSCP: it has a route on BOTH sides (winget + brew), so
# one tool serves the Windows colleagues and the Mac. GPL-3.0, vendor-published, and it
# also ships a WiX MSI on Windows.
#
# The honest trade-off against WinSCP: Cyberduck is a SINGLE-PANE server browser, where
# FileZilla and WinSCP are two-pane local↔remote. For somebody used to dragging between
# two panels that is a real change of habit, not a cosmetic one.
#
# ⚠️ NOT YET VALIDATED against the Medidata Rave endpoint — same caveat as WinSCP: Rave
# may require a particular FTPS mode, TLS version, or client certificate, and a client
# can list "FTPS" among its protocols and still fail on that server. C tests with Isabelle.
#
# ids read from the sources (verified 2026-08-02): manifests/i/Iterate/Cyberduck for
# winget, `brew info --cask cyberduck` for macOS.
name: Cyberduck
description: FTP, FTPS, SFTP and cloud storage browser — runs on Windows and macOS
winget: Iterate.Cyberduck
brew: cyberduck
# NO detect: — GUI app, no CLI binary on PATH. (The vendor ships a separate
# Iterate.CyberduckCLI package; this row is the GUI the users would actually open.)
category: [legacy]

# Held for arbitration: nobody has decided which upgrade of this application is worth taking,
# so Apply does not push one. ⚠️ NOT a blindfold — the row still SHOWS a newer version, greyed,
# and the per-row button still offers it. Replace this with `latest` or an exact version once
# the decision is made; `grep -c 'version: "pending"' catalog/*.yaml` is then the work left.
version: "pending"
