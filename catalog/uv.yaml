# uv — Python, made instant. What lets an agent build and run a program for you on the
# spot: `uvx markitdown report.docx` reads a document the agent could not open otherwise,
# `uv run script.py` runs what it just wrote, no environment to prepare.
name: uv
description: Python made instant — an agent runs and builds programs for you with it
winget: astral-sh.uv
brew: uv
detect: uv --version
version: latest
category: [languages]
