# MarkText — distraction-free Markdown editor.
name: MarkText
description: Distraction-free Markdown editor — specs, briefs, notes
winget: MarkText.MarkText
brew: mark-text
# NO detect: — GUI app, no CLI binary on PATH. Presence via the native
# system-manager route (winget on Windows, brew on Mac), like Obsidian.
# Indeterminate only where no system manager is practicable, never absent.
category: [editors]

# Held for arbitration: nobody has decided which upgrade of this application is worth taking,
# so Apply does not push one. ⚠️ NOT a blindfold — the row still SHOWS a newer version, greyed,
# and the per-row button still offers it. Replace this with `latest` or an exact version once
# the decision is made; `grep -c 'version: "pending"' catalog/*.yaml` is then the work left.
version: "pending"
