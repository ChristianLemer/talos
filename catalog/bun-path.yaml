# Bun PATH — a config-atom that puts ~/.bun/bin on the PATH of the shells that
# matter (zsh, bash, Nushell on macOS/Linux; the registry User Path + Nushell on
# Windows). Without it, a CLI installed by `bun add -g` (e.g. Claude Code) lands
# in ~/.bun/bin — a dir nothing adds to PATH when bun came from brew/winget — so
# it installs but stays "command not found" for the terminal, VSCode and Talos.
# apply = converge (idempotent, sentinel block); check = dry-run (exit 0/1).
#
# Pulled by NOTHING now that Claude Code and the skills route through npm (npm's
# global bin is already on PATH). It stays because it is exactly what someone who
# opts into Bun needs next, and because a machine that took the bun route in an
# earlier Talos revision may still be missing the PATH entry.
name: Bun PATH
description: Puts ~/.bun/bin on the shell PATH so bun-installed CLIs are found
# ⚠️ SINGLE quotes, and it is not a style choice. On Windows `run:`/`check:` go through
# PowerShell (`platform::shell_probe`), which INTERPOLATES inside double quotes: a `$word`
# anywhere in `{dir}` expands to nothing and the path silently breaks. Measured under pwsh:
# `"x/$Documents/y"` → `x//y`, while `'x/$Documents/y'` survives intact. A corporate share
# path is exactly where a `$` shows up, so the double-quoted form was a row that reads
# absent for a reason no operator could see.
run: nu '{dir}/bun-path.nu' apply
check: nu '{dir}/bun-path.nu' check
# No uninstall: leaving the PATH entry is inert, and the sentinel block is ours to
# remove later if we add a remove verb (same no-clobber stance as starship-config).
category: [foundation]
requires:
  - Bun
