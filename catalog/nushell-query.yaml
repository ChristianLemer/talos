# Query for Nushell — a plugin that SHIPS WITH nushell: the binary is already beside `nu`.
# ⭐ No `plugin-release:`, and that absence is the whole declaration — it puts this on the
# ⚡ rung, because registering it engages no network at all (measured: `plugin add
# nu_plugin_query` resolves via NU_PLUGIN_DIRS, which contains the directory holding `nu`).
name: Query for Nushell
description: Query over JSON/XML data in nushell
nu-plugin: query
category: [terminal]
requires:
  - Nushell
