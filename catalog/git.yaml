# Git — version control. Agents work in repositories, and plugin marketplaces are git
# clones, so this is the first thing a machine needs.
#
# THE SHAPE OF A PACKAGE: a `name:` (what bundles and `requires:` refer to), one id per
# manager Talos may use on this machine (`winget:` on Windows, `brew:` on macOS), a
# `detect:` command whose success means "present" and whose output carries the version,
# and a `version:` policy. `latest` says: keep it current. `category:` only groups the
# row in the Catalog view — it never decides anything.
name: Git
description: Version control — agents work in repositories, plugins are git clones
winget: Git.Git
brew: git
detect: git --version
version: latest
category: [foundation]
# A BEHAVIOUR SEED: installing this elevates on Windows (winget asks for authorisation).
# Apply warns before it acts. Declare only what you have seen.
uac: true
