# FileZilla — FTP/SFTP client. Binary only for now; the FTP config atom will be
# added later (like starship-config) when the config file is available.
#
# ⚠️ NO WINGET ROUTE — and the id that used to be here was REAL, then withdrawn.
# `TimKosse.FileZilla.Client` existed and was DELETED from winget on 2022-03-25
# (winget-pkgs PR #55678, reason: "Failed downloading installer(s)"), so Windows failed
# with "winget cannot find TimKosse.FileZilla.Client" — a row that could only ever fail.
# Verified gone 2026-08-02: `manifests/t/TimKosse` → HTTP 404, and no publisher under
# `t/` or `f/` carries a FileZilla package.
#
# THE REASON IS NOT ADWARE. That was the natural assumption and it is wrong: the current
# NSIS installer contains no bundled-offer strings at all (script decompressed and
# scanned). It is the AUTHOR'S REFUSAL over bandwidth. Tim Kosse, winget-pkgs issue
# #78578: "The infrastructure on filezilla-project.org and its subdomains is meant to be
# used only by humans and FileZilla itself, not third-party installers. If you want to
# re-distribute FileZilla using your third-party installer, you absolutely must host the
# binaries on your own infrastructure." winget enforces it as standing policy — six
# re-requests since, all closed "License prevents package from being added", and FileZilla
# is the named example in winget's own "Package Deny List" issue (#97604).
#
# THERE IS ONE WORKING UNATTENDED ROUTE, deliberately not taken here: `choco install
# filezilla -y`. It works precisely because the Chocolatey package VENDORS the installer
# (~13 MB inside the nupkg) and never touches FileZilla's servers — which is the exact
# condition Kosse set, so it is compliance, not a loophole. Not adopted because Talos has
# no chocolatey route and the corporate estate has not said choco is allowed; if it is, this
# is the answer for the free client. (Direct download is NOT scriptable: URLs are
# token-gated `?h=…&x=…`, the site answers "Human verification required", and a UA-less
# request gets 403. No MSI, no enterprise build. MS Store has only the paid Pro, US-only.)
#
# Left with no route ON PURPOSE rather than deleted: the row then reads INDETERMINATE
# ("—", no practicable route here) instead of failing, which is the truth, and the Legacy
# bundle keeps naming the tool those users really do use for Medidata Rave over FTPS/SFTP.
# Replacement candidates live in the "FileZilla alternatives" bundle, pending a Rave test.
name: FileZilla
description: FTP, FTPS and SFTP client
category: [legacy]
