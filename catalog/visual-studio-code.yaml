# Visual Studio Code — where a person reads and edits what the agent writes. A graphical
# app: on macOS the brew id is a CASK, and brew resolves it as such.
name: Visual Studio Code
description: Where you see and edit what the agent produces
winget: Microsoft.VisualStudioCode
brew: visual-studio-code
detect: code --version
version: latest
category: [editors]
uac: true
