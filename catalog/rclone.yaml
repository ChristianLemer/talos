# rclone — rsync for cloud storage: moves data between a machine and ~70 providers
# (OneDrive, S3, Drive, SFTP…) under one grammar.
#
# category `cloud` (with the AWS CLI), NOT a new `data` one: the category is the
# Catalog tab's grouping, so minting one for a single member buys a header and an
# orphan. It ships in the DATA bundle — that's the work it serves (getting a dataset
# where the tooling can reach it); the bundle says what it's for, the category says
# what it is.
name: rclone
description: Rsync for cloud storage — sync data across OneDrive, S3, Drive and ~70 more
winget: Rclone.Rclone
brew: rclone
detect: rclone --version
category: [cloud]
# Observed on a corporate network (C, 2026-08-01): the corporate firewall answers 403 on this
# one. A SEED for a fresh machine, extended by the shared behaviour file as the fleet meets
# the same wall.
#
# Quoted for the reader, not out of necessity — serde matches the renamed field on the key's
# text, so a bare `403:` parses identically (measured). The Rust field behind it is
# `forbidden`, since an identifier cannot start with a digit.
#
# ⚠️ If the firewall ever opens, this is ALSO the escape hatch — change it to `false` here
# rather than emptying the shared file. An observation can only ratchet a fact ON; the
# catalogue is the one place that can turn it off, and it leaves a diff saying who decided.
"403": true

# Held for arbitration: nobody has decided which upgrade of this application is worth taking,
# so Apply does not push one. ⚠️ NOT a blindfold — the row still SHOWS a newer version, greyed,
# and the per-row button still offers it. Replace this with `latest` or an exact version once
# the decision is made; `grep -c 'version: "pending"' catalog/*.yaml` is then the work left.
version: "pending"
