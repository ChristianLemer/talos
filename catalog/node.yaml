# Node.js — the JavaScript runtime. Talos itself does not need it; the agent ecosystem
# does: Claude Code installs through npm, `npx skills` installs skills, and published
# plugins run their hooks with a literal `node`. A machine without it is not minimal, it
# is exotic — removing it once made that dependency implicit and broke plugin hooks on
# Windows (2026-07-26), which is why a test guards its place in Base.
#
# Current, not LTS: two Node installs confuse the PATH, and a team that shipped both
# learned to keep exactly one.
name: Node.js
description: JavaScript runtime — npm, npx and every plugin hook lean on it
winget: OpenJS.NodeJS
brew: node
detect: node --version
version: latest
category: [foundation]
uac: true
