# Bun — JavaScript runtime & package manager (Anthropic-owned, single binary).
# Talos uses it as the JS launcher: `bun add -g` for global CLIs (Claude Code) and
# `bunx` for the cross-agent skills CLI. Replaces the old Node.js/npm dependency —
# one binary, no graphical installer, upgraded with a single command.
name: Bun
description: All-in-one JS runtime & package manager — the launcher for CLI agents and skills
brew: bun
winget: Oven-sh.Bun # UNVERIFIED — confirm with `winget show` on Windows before release
detect: bun --version
category: [foundation]
