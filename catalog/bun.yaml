# Bun — JavaScript runtime & package manager (Anthropic-owned, single binary).
# In NO bundle: nothing pulls it in, so on a clean machine it stays absent. Kept in
# the catalogue for two real uses — someone who WANTS bun installs it in one click,
# and a bun left behind by an earlier Talos revision (which routed Claude Code
# through `bun add -g`) is still detected, upgradable and uninstallable.
#
# Why it stopped being the socle's JS launcher: Node.js has to be present anyway,
# because published Claude plugins invoke a hardcoded `node` (see catalog/node.yaml).
# Bun cannot satisfy that, so keeping it as the agent's installer meant carrying two
# runtimes to gain nothing. The `bun:` route in src/bundles.rs still works and is
# still tested — this is a routing decision, not a removal.
name: Bun
description: All-in-one JS runtime & package manager — optional, pulled by nothing
brew: bun
winget: Oven-sh.Bun # UNVERIFIED — confirm with `winget show` on Windows before release
detect: bun --version
category: [foundation]

# Held for arbitration: nobody has decided which upgrade of this application is worth taking,
# so Apply does not push one. ⚠️ NOT a blindfold — the row still SHOWS a newer version, greyed,
# and the per-row button still offers it. Replace this with `latest` or an exact version once
# the decision is made; `grep -c 'version: "pending"' catalog/*.yaml` is then the work left.
version: "pending"
