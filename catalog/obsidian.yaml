# Obsidian — local Markdown knowledge base.
name: Obsidian
description: Local Markdown knowledge base
winget: Obsidian.Obsidian
brew: obsidian
# NO detect: — Obsidian is a GUI app with no CLI binary on PATH. Presence is
# derived from the native system-manager ROUTE (winget list on Windows, brew
# list on Mac), not a hand-written command. Indeterminate only where no system
# manager is practicable, never absent. See detect.rs systemProbe.
category: [notes]

# Held for arbitration: nobody has decided which upgrade of this application is worth taking,
# so Apply does not push one. ⚠️ NOT a blindfold — the row still SHOWS a newer version, greyed,
# and the per-row button still offers it. Replace this with `latest` or an exact version once
# the decision is made; `grep -c 'version: "pending"' catalog/*.yaml` is then the work left.
version: "pending"
