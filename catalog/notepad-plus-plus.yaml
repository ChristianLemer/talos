# Notepad++ — source code editor and Notepad replacement for Windows.
name: Notepad++
description: Source code editor and Notepad replacement for Windows.
winget: Notepad++.Notepad++
category: [legacy]
# Asks for an authorisation on Windows via winget (colleague, 2026-08-04).
# The watcher missed it — it samples every 1.2 s and does not see consent.exe,
# which is outside Talos's process tree. A report beats its silence.
uac: true

# Held for arbitration: nobody has decided which upgrade of this application is worth taking,
# so Apply does not push one. ⚠️ NOT a blindfold — the row still SHOWS a newer version, greyed,
# and the per-row button still offers it. Replace this with `latest` or an exact version once
# the decision is made; `grep -c 'version: "pending"' catalog/*.yaml` is then the work left.
version: "pending"
