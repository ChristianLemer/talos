# Claude Code — the agent. THE NPM ROUTE: `npm:` names the package, installed globally;
# it therefore `requires:` Node.js BY NAME — the name in node.yaml, not the file name. A
# requirement that is absent takes this row out of the perimeter with the reason shown.
name: Claude Code
description: Anthropic's coding agent, on the command line
npm: "@anthropic-ai/claude-code"
detect: claude --version
version: latest
category: [agents]
requires:
  - Node.js

# THE DOCTOR: this package may be launched from the Doctor tab as a rescue session, by
# absolute path and no shell. `clean.env`: a fresh per-machine directory handed through
# CLAUDE_CONFIG_DIR yields a session with no plugins, no hooks, no memory, no inherited
# settings — and auth survives, because credentials come from the keychain (MEASURED on
# macOS). Not `--bare`: measured, that skips plugin SYNC, keeps the plugins loaded and
# drops the keychain — the opposite of a rescue. A capability, never a category.
doctor:
  clean: { env: CLAUDE_CONFIG_DIR }
