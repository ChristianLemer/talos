# WinSCP — FTP/FTPS/SFTP/SCP/WebDAV/S3 client for Windows. A CANDIDATE to replace
# FileZilla, which winget cannot ship (see catalog/filezilla.yaml).
#
# The corporate argument, beyond features: WinSCP ships a real MSI
# (`InstallerType: wix`), so IT can deploy it the way it deploys everything else.
# GPL, vendor-published, 38 versions in winget — no third-party repackaging.
#
# Windows only: there is no brew formula/cask, so on macOS this row reads
# indeterminate ("—"), which is honest. Cyberduck is the cross-platform candidate.
#
# ⚠️ NOT YET VALIDATED against the Medidata Rave endpoint. Rave may require a specific
# FTPS mode (implicit vs explicit), a TLS version, or client-certificate auth — a client
# can advertise "FTPS" and still fail on that particular server. C tests with Isabelle;
# until then this is an opt-in candidate, not a replacement.
#
# id read from the manifest at manifests/w/WinSCP/WinSCP (verified 2026-08-02), never
# inferred from the vendor's name — that is the mistake filezilla.yaml records.
name: WinSCP
description: FTP, FTPS, SFTP and SCP client — ships an MSI, deployable by IT
winget: WinSCP.WinSCP
# NO detect: — GUI app, no CLI binary on PATH (same as Notepad++, Obsidian, Miro).
# Presence comes from the native route, winget list, which is the only honest probe here.
category: [legacy]
