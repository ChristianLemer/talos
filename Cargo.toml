[package]
name = "talos-spike"
version = "0.0.1"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
regex = "1"
serde_yaml = "0.9"
rust-embed = "8"
chrono = "0.4"

[[bin]]
name = "pty-smoke"
path = "src/pty_smoke.rs"

[[bin]]
name = "talos-spike"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
