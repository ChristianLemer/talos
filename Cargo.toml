[package]
name = "talos"
version = "0.0.1"
edition = "2021"
# Two [[bin]] targets (Talos + pty-smoke) → Tauri can't tell which to bundle since
# the bin no longer matches the crate name. default-run settles it: Talos.
default-run = "Talos"

[dependencies]
tauri = { version = "2", features = [] }
# Persists window size+position on close, restores on launch, clamped to the visible
# area (never off-screen if a monitor disappears). 960×540 is now only the very first
# launch default. Cross-platform out of the box.
tauri-plugin-window-state = "2"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
regex = "1"
serde_yaml = "0.9"
rust-embed = "8"
chrono = "0.4"

[[bin]]
name = "pty-smoke"
path = "src/pty_smoke.rs"

[[bin]]
name = "Talos"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
chrono = "0.4"
