[package]
name = "talos"
version = "0.0.1"
edition = "2021"
license = "MIT"
# Two [[bin]] targets (Talos + pty-smoke) → Tauri can't tell which to bundle since
# the bin no longer matches the crate name. default-run settles it: Talos.
default-run = "Talos"

[dependencies]
tauri = { version = "2", features = [] }
# Persists window size+position on close, restores on launch, clamped to the visible
# area (never off-screen if a monitor disappears). 960×540 is now only the very first
# launch default. Cross-platform out of the box.
tauri-plugin-window-state = "2"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
regex = "1"
serde_yaml = "0.9"
rust-embed = "8"
chrono = "0.4"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }
# The engine names its local copy after its own sha256 (relocate.rs). Already in the tree
# through tauri; 0.10 is the line the lock carries.
sha2 = "0.10"
vt100 = "0.16"
# The kit's content archive (content.rs): READ only, stored or deflated entries — no
# compressor, no other codec. `flate2` is named so its pure-Rust backend is on: through zip
# alone it comes with no backend at all, and miniz_oxide is already in the tree.
zip = { version = "9.1.1", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[[bin]]
name = "pty-smoke"
path = "src/pty_smoke.rs"

[[bin]]
name = "Talos"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
chrono = "0.4"
