[package]
name = "talos"
version = "0.0.1"
edition = "2021"
# Deux [[bin]] (Talos + pty-smoke) → Tauri ne sait pas lequel empaqueter depuis que
# le bin ne s'appelle plus comme le crate. default-run tranche : c'est Talos.
default-run = "Talos"

[dependencies]
tauri = { version = "2", features = [] }
# Persiste taille+position de la fenêtre à la fermeture, restaure au lancement, en
# clampant dans la zone visible (jamais hors-écran si un moniteur disparaît). 960×540
# n'est plus que le défaut du TOUT 1er lancement. Multi-plateforme d'office.
tauri-plugin-window-state = "2"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
regex = "1"
serde_yaml = "0.9"
rust-embed = "8"
chrono = "0.4"

[[bin]]
name = "pty-smoke"
path = "src/pty_smoke.rs"

[[bin]]
name = "Talos"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
chrono = "0.4"
