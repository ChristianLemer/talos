# ⚠️ THE SUBJECT MUST DECLARE NOTHING, and it keeps moving as facts get promoted: a package
# whose `catalog/` entry already says `uac: true` makes this fixture indistinguishable from the
# declaration. `nushell` was the subject until the fleet observed a real elevation on it and it
# was promoted (2026-08-08). `helix` is the current one — nothing has flagged it, and it is
# present on both routes so the row can be an upgrade.
# THE ELEVATION ONE, and the reason this folder exists at all. `uac: true` makes the row
# read "asks for your password".
#
# ⭐ ON macOS THIS FACT CANNOT BE OBSERVED. The window watcher that sets `saw_window` is
# `#[cfg(target_os = "windows")]` (`src/server.rs`, the watcher thread and both relay
# blocks), so no macOS run can ever produce `uac: true` — this fixture is the ONLY way to
# see that label on a Mac. Contrast `uv.yaml`: `forbidden::is403` has no platform
# gate, so a Mac behind a corporate firewall really does collect a 403. See the README.
#
# The choice of package was constrained twice, and both constraints cost a rewrite if
# ignored:
#   1. NOT one of the four packages that declare `uac: true` in `catalog/` (7-Zip, AWS CLI,
#      Node.js, VS Code) — a seeded row looks identical whether this file was read or not.
#   2. NOT a row that is out of scope on the verifying machine, which the eye skips. Git
#      reads `external` on the dev Mac (Xcode CLT) and both config-atoms derive out, which
#      rules out the three obvious picks.
brew/darwin:
  uac: true
winget/windows:
  uac: true
