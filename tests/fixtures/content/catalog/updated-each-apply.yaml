# FORM: `update-on: apply` — the tool's own `update:` runs at each Apply until it succeeds once
# (then the row is done until a Refresh), and the command itself knows when there is nothing to do. No scan is needed, so the route can be one nothing
# scans (npm here) and no `detect:` is required.
name: Updated Each Apply
description: A tool kept current by its own update command, run by the Apply
npm: "@vendor/each-apply"
version: "self"
update: each-apply update
update-on: apply
category: [agents]
requires:
  - Node.js
