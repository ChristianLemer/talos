<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access granted</title>
<!-- Shown INSIDE Talos's 403 panel (unblock.rs) when the firewall's page let the download
     through: the approval worked. Nothing is downloaded here — the panel above counts down
     and Talos retries by itself. Talos's own palette (index.html :root). -->
<style>
  :root { --bg:#1a1b26; --fg:#c0caf5; --dim:#565f89; --head:#7aa2f7; }
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:42ch; text-align:center; padding:24px; }
  .ring { width:64px; height:64px; margin:0 auto 14px; border-radius:50%;
          border:3px solid var(--head); display:flex; align-items:center; justify-content:center;
          color:var(--head); font-size:30px; animation:pulse 1.6s ease-out infinite; }
  @keyframes pulse {
    0% { box-shadow:0 0 0 0 rgba(122,162,247,.45); }
    100% { box-shadow:0 0 0 18px rgba(122,162,247,0); }
  }
  h1 { font-size:18px; margin:0 0 6px; color:var(--head); }
  p { color:var(--dim); margin:0; }
</style>
</head>
<body>
<main>
  <div class="ring">✓</div>
  <h1>Access granted</h1>
  <p>Talos retries the download by itself in a few seconds — nothing to do here.</p>
</main>
</body>
</html>
