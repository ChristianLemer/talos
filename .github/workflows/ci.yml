# CI — keeps `main` green. Runs on every push/PR: it PROVES the code compiles,
# the Rust logic passes, the pure JS model passes, and clippy is clean. It does
# NOT build the GUI bundle or prove the app runs (that's release.yml, on a tag);
# the real runtime check stays a manual smoke-test on a real machine (see the
# porting garde-fous, kept with the project's private notes).
#
# WHY ubuntu for the Rust jobs: the core logic is OS-agnostic and Linux runners
# are the fastest/cheapest. But talos pulls tauri v2, whose build script links
# WebKitGTK at COMPILE time — so even a plain `cargo build`/`test` needs the GTK
# dev libs installed first (the `System deps` step). The frontend is static
# `public/` (frontendDist), so — unlike a JS-framework Tauri app — there is NO
# npm build step to run before cargo.
#
# The tree is rustfmt-clean (community default, 100 col, no rustfmt.toml), so
# `cargo fmt --check` is enforced here. Clippy runs with `-D warnings`: any lint
# fails the build, locking the clean state rather than merely reporting it.

name: ci

on:
  push:
    # `beta` is the living branch. It was called `tauri` until 2026-08-09 — a name
    # that described the FRAMEWORK, which had already been replaced once (Deno →
    # Rust/Tauri), so it was one migration away from lying again.
    branches: [main, beta]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  rust:
    name: cargo build + test + clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format check
        run: cargo fmt --check

      - name: System deps for tauri-build
        # tauri v2's build script links WebKitGTK at compile time; without these
        # dev libs even `cargo build` aborts. Plain apt-get (NOT a pinned-version
        # cache action): a rotated transitive dep would 404 and the pinned action
        # would silently install nothing while exiting 0. `apt-get update` keeps
        # the index fresh so a real failure actually fails the step.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  windows-lints:
    name: cargo test + clippy (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # ⭐ WHY a second platform, and why it is not redundant with the job above.
      #
      # beta.24 shipped a `dead_code` error that failed `clippy -D warnings` on WINDOWS
      # ONLY: the function's callers are `#[cfg(all(test, unix))]`, so it is dead exactly
      # there, while its `allow` was gated on `not(windows)`. CI was GREEN on that commit
      # and could not have been otherwise — it ran on ubuntu alone. Re-running the four
      # verifications harder on one OS would never have caught it.
      #
      # This repo is full of `cfg(target_os)` — the appmgmt probe, the AppMgmtStatus
      # variants, `quiet_command`'s creation flags, the whole POSIX/Windows split in
      # platform.rs. Every one of those is a place where a lint can be true on one
      # platform and false on another, which makes single-platform linting structurally
      # unable to protect the tree.
      #
      # No `cargo build` and no fmt here: fmt is platform-independent (the job above owns
      # it) and release.yml already proves the Windows binary compiles, on tags. Lints and
      # tests are the half that catches cfg-gated defects, and Windows runner minutes bill
      # at 2× — so scope is what buys the check.
      - name: Test
        run: cargo test --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  js:
    name: node --test (pure model)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      # No package.json / no deps: the tests are plain .mjs importing public/*.js
      # and run under Node's built-in test runner. `node --test` auto-discovers
      # test/*.test.mjs (do NOT pass a dir — `node --test test/` treats the path
      # as a module and fails with MODULE_NOT_FOUND).
      - name: Test
        run: node --test
