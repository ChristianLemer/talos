# Release — on a tag `v*`, each OS runner NATIVELY builds its target with
# `cargo tauri build` and attaches the bundle(s) to a GitHub Release. Native per
# OS because Tauri does NOT cross-compile (WebView2 + MSVC on Windows, WebKit on
# macOS). Pre-release is automatic when the tag contains a `-` (v0.1.0-beta.1 →
# pre-release; v0.1.0 → latest).
#
# NO runtime smoke-test: the binary is now a NATIVE GUI app (Tauri window), not a
# headless server — it won't boot reliably on a display-less runner. The real
# runtime check is a manual smoke-test on a real Windows machine (see the porting
# garde-fous in docs/superpowers/TASK-tauri-migration.md). CI proves it COMPILES
# and produces installable bundles; it does not prove it runs.
#
# The runner produces UNSIGNED bundles (signing/notarisation is a separate step,
# deliberately deferred). windows-latest is x64 native → MSVC + WebView2 already
# present, which sidesteps the Parallels cross-compile pitfalls.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the Release and upload assets

jobs:
  build:
    strategy:
      fail-fast: false # one OS failing shouldn't cancel the other's artifact
      matrix:
        include:
          - os: macos-14 # Apple Silicon runner → aarch64-apple-darwin
            # the .app (a directory) zipped — a Release asset must be a single file
            artifacts: |
              Talos-macos-aarch64.app.zip
          - os: windows-latest # x64 runner → x86_64-pc-windows-msvc
            # bare exe only — the deliverable is exe + bundles/ rsync'd, no installer
            artifacts: |
              target/release/Talos.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Native GUI build → produces the OS bundle(s). No cross-compile.
      - name: Build (cargo tauri build)
        run: cargo tauri build

      # A .app is a directory; a Release asset must be a single file. ditto keeps
      # the bundle's symlinks/permissions intact (plain zip would mangle them).
      - name: Zip the .app (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent target/release/bundle/macos/Talos.app Talos-macos-aarch64.app.zip

      - name: Upload bundle(s) to the Release
        uses: softprops/action-gh-release@v2
        with:
          # A tag containing "-" (v0.1.0-beta.1) is flagged pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ${{ matrix.artifacts }}
          fail_on_unmatched_files: false # bundle naming varies by version; don't hard-fail
