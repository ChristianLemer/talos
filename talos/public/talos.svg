<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#0d1117"/>
  <!-- Geometric mark: the Sagittarius arrow (centaur-archer essence) rising
       through a circle. Two arcs = the two natures sharing one center; the
       arrow = the shared act, aimed upward. Built purely on a circle grid. -->
  <g transform="translate(256 256)">
    <!-- carbon arc (left/lower) and silicon arc (right/upper): one ring, two halves -->
    <g fill="none" stroke="#e6edf3" stroke-width="22" stroke-linecap="round">
      <!-- lower-left half of the ring -->
      <path d="M 0 150 A 150 150 0 0 1 -106 -106"/>
    </g>
    <g fill="none" stroke="#58a6ff" stroke-width="22" stroke-linecap="round">
      <!-- upper-right half of the ring -->
      <path d="M 0 150 A 150 150 0 0 0 106 -106"/>
    </g>
    <!-- the arrow: diagonal shaft from lower-left to upper-right, through center -->
    <g stroke="#e6edf3" stroke-width="22" stroke-linecap="round">
      <line x1="-120" y1="120" x2="120" y2="-120"/>
    </g>
    <!-- arrowhead -->
    <path d="M120 -120 L64 -116 L116 -64 Z" fill="#e6edf3"/>
    <!-- the crossbar of the Sagittarius glyph -->
    <g stroke="#58a6ff" stroke-width="22" stroke-linecap="round">
      <line x1="-8" y1="-56" x2="56" y2="8"/>
    </g>
  </g>
</svg>
